[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7.5"
tokio = { version = "1.39.2", features = ["full"] }
serde = { version = "1.0.204", features = ["derive"] }
reqwest = "0.12.5"
chrono = { version = "0.4.38", features = ["serde"] }
serde_json = "1.0.120"
tower-http = { version = "0.5.2", features = ["fs"] }
rss = "2.0.7"
scraper = "0.19.0"
tokio-cron-scheduler = "0.9.4"
futures = "0.3.30"
